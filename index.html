<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Shaxsi — video portfolio.">
<title>Shaxsi — video portfolio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111313;color:#f5f3eb;font-family:Arial,sans-serif}main{max-width:1120px;margin:auto;padding:40px 6vw 64px}header{display:flex;justify-content:space-between;align-items:center;padding-bottom:60px;border-bottom:1px solid #353737}.brand{font-size:23px;font-weight:700;letter-spacing:-1px}.label{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#b9bcb7}.hero{padding:80px 0}h1{font-size:clamp(54px,10vw,116px);line-height:.98;letter-spacing:-.06em;font-weight:500;margin:22px 0 32px}h1 span{color:#cbf581}p{color:#b9bcb7;line-height:1.7;max-width:490px;font-size:17px}.works{padding:32px 0;border-top:1px solid #353737}h2{font-size:24px;font-weight:400}.empty{padding:36px;border:1px solid #353737;border-radius:16px;background:#191c1b;margin-top:24px}.empty p{margin:8px 0 0}footer{margin-top:64px;color:#92978f;font-size:13px}@media(max-width:520px){header{padding-bottom:30px}.hero{padding:55px 0}.empty{padding:24px}.label{font-size:10px;letter-spacing:1px}}
.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:32px}.video-card{min-width:0}.video-card iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#191c1b}.video-card h3{font-weight:500;font-size:21px}.video-card p{white-space:pre-wrap;overflow-wrap:anywhere}.video-card a,footer a{color:#cbf581}footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}#video-status:empty{display:none}</style>
</head>
<body><main>
<header><div class="brand">shaxsi.</div><div class="label">Video portfolio</div></header>
<section class="hero"><div class="label">Stories in motion</div><h1>Every frame.<br>A new <span>story.</span></h1><p>Stories told through moving images.</p></section>
<section class="works" aria-labelledby="works-title"><h2 id="works-title">Selected work</h2><p id="video-status" role="status">Loading films…</p><div id="videos" class="video-grid"></div><noscript><p>Please enable JavaScript to view the video portfolio.</p></noscript></section>
<footer>Shaxsi · Video portfolio <a href="manage.html">Manage videos</a></footer>
</main><script type="module">import {loadVideos} from "./portfolio.js";loadVideos(document.getElementById("videos"),document.getElementById("video-status"));</script></body>
</html>
