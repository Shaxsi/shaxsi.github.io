<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="AI Storytelling &amp; Brand Commercials © Ekaterina AKA Seedreamdog — a film portfolio. Stories in motion.">
<title>AI Storytelling &amp; Brand Commercials © Ekaterina AKA Seedreamdog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--black:#080808;--milk:#f2ede3;--muted:#aca79f;--line:#34312d}
*{box-sizing:border-box}
body{margin:0;background:var(--black);color:var(--milk);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1440px;margin:auto;padding:32px 5vw 28px}
header{display:flex;justify-content:flex-end;align-items:center;gap:20px;padding-bottom:25px;border-bottom:1px solid var(--line)}
.brand{font-family:Georgia,'Times New Roman',serif;font-size:23px;letter-spacing:-.7px}
.label{font-size:10px;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted)}
.hero{padding:85px 0 82px}
.hero .label{color:var(--milk)}
h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(30px,6.6vw,96px);line-height:1.04;letter-spacing:-.055em;font-weight:400;margin:25px 0 0}
h1 .title-line{display:block}
.signature{display:flex;align-items:center;gap:14px;font-family:Arial,Helvetica,sans-serif;font-size:clamp(18px,2.4vw,30px);letter-spacing:-.03em;margin-top:28px}
.signature .copyright{font-size:.7em;color:var(--muted)}
p{color:var(--muted);line-height:1.7;font-size:15px}
.works{padding:26px 0 0;border-top:1px solid var(--line)}
h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:400;margin:0 0 30px}
.video-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:50px 28px}
.video-card{min-width:0}
.video-player{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.video-card iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.video-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@supports not (aspect-ratio:16/9){.video-player{height:0;padding-bottom:56.25%}}
.video-card h3{font-family:Georgia,'Times New Roman',serif;font-size:clamp(24px,2.5vw,34px);font-weight:400;letter-spacing:-.5px;margin:20px 0 10px}
.video-card p{max-width:700px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 16px}
a{color:var(--milk);text-decoration-thickness:1px;text-underline-offset:5px}
a:hover{color:#fff}
a:focus-visible{outline:2px solid var(--milk);outline-offset:6px}
.video-card a{font-size:11px;letter-spacing:1px;text-transform:uppercase}
footer{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:85px;padding-top:25px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer a{color:var(--muted)}
#video-status:empty{display:none}
@media(max-width:600px){main{padding:24px 6vw}.brand{font-size:20px}header .label{font-size:9px;letter-spacing:1.2px}.hero{padding:62px 0}.video-grid{grid-template-columns:1fr;gap:38px}.signature{margin-top:22px}footer{margin-top:60px}}

:root{--black:#030404;--milk:#f0eae9;--muted:#b8c3bd;--line:#35413b;--rose:#ddb4c4;--mint:#b9d7c5}
body{min-height:100vh;background:radial-gradient(ellipse 75% 24% at 45% -8%,#ffffff16,transparent 80%),linear-gradient(116deg,transparent 18%,#ffffff04 28%,#ffffff0a 29%,transparent 43%),radial-gradient(ellipse at 95% 18%,#98b7a608,transparent 42%),#030404}
main{position:relative}
header{border-color:#c9dfd122}
.label{color:#b4c6bb;letter-spacing:3px}
.hero{position:relative;padding:92px 0 86px}
.hero .label{color:#bed3c5}
.hero:after{content:"";position:absolute;right:4%;top:7%;width:180px;height:180px;border:1px solid #d7ede122;border-radius:50%;box-shadow:0 0 70px #c4dcc010,inset 0 0 45px #ffffff08;pointer-events:none;z-index:-1}
h1{font-family:'Anton',Impact,'Arial Narrow',sans-serif;font-size:clamp(29px,6.3vw,90px);font-weight:400;line-height:1.14;letter-spacing:-.015em}
h1 .title-line{width:fit-content;max-width:100%;color:#be91a8;text-transform:uppercase;-webkit-text-stroke:1px #657c6c;paint-order:stroke fill;filter:drop-shadow(2px 3px 0 #8fa99a66) drop-shadow(0 5px 18px #d9a6be24)}
@supports ((background-clip:text) or (-webkit-background-clip:text)){
h1 .title-line{background:linear-gradient(125deg,#eed2de 0%,#dcb2c8 35%,#d6ded0 66%,#a8cbb4 100%);background-clip:text;-webkit-background-clip:text;color:transparent}
}
.signature{font-family:Arial,Helvetica,sans-serif;color:#c7d4cc;font-size:clamp(14px,2vw,24px);font-weight:400;letter-spacing:.02em;line-height:1.6;gap:10px;flex-wrap:wrap;margin-top:30px}
.signature .copyright{color:#aebfb4}
.works{border-color:#c9dfd122}
h2{color:#bed3c5;letter-spacing:3px}
.video-grid{gap:32px}
.video-card{padding:14px 14px 24px;background:linear-gradient(145deg,#ffffff09,#ffffff02 35%,#00000055);border:1px solid #d1e0d51f;border-radius:20px;box-shadow:inset 0 1px 0 #ffffff14,0 12px 40px #00000050}
.video-player{border-radius:10px;overflow:hidden;box-shadow:0 3px 15px #465d4c12}
.video-card h3{font-family:Georgia,'Times New Roman',serif;color:#eee6e9;font-size:clamp(23px,2.3vw,30px)}
.video-card p{color:#b8c5bc}
.video-card a{color:#bbd6c5}
a:hover{color:#e3bccf}
a:focus-visible{outline-color:#c1decc}
footer{border-color:#c9dfd122;color:#b8c5bc;line-height:1.7}
footer a{color:#bbd6c5}
::selection{background:#d3b2c7;color:#253e2f}
@media(max-width:600px){.hero{padding:62px 0}.video-card{padding:10px 10px 20px;border-radius:15px}.hero:after{width:100px;height:100px;right:0}.signature{font-size:14px}}


header{min-height:122px;gap:24px}
.profile-portrait{display:block;width:104px;height:104px;flex-shrink:0;border-radius:50%;object-fit:cover;object-position:50% 44%;border:2px solid #c1d5c27a;box-shadow:0 0 0 5px #ffffff04,0 0 28px #d4afc51c}
@media(max-width:600px){header{min-height:92px;gap:18px}.profile-portrait{width:76px;height:76px}}

.hero:after{display:none}
.hero{padding-top:35px}
.hero-intro{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-right:4%;min-height:180px}
.hero-intro .profile-portrait{width:180px;height:180px;box-shadow:0 0 0 7px #ffffff03,0 0 60px #bed7c11a}
.watermark-circle{display:flex;align-items:center;justify-content:center;width:104px;height:104px;flex-shrink:0;border-radius:50%;border:1px solid #c1d5c25a;background:radial-gradient(ellipse at 35% 15%,#ffffff12,#080a09 70%);box-shadow:0 0 25px #d4afc510}
.watermark-logo{display:block;width:90px;height:90px;object-fit:contain}
@media(max-width:600px){.hero{padding-top:28px}.hero-intro{padding-right:0;min-height:128px;gap:15px}.hero-intro .profile-portrait{width:128px;height:128px}.hero-intro .label{font-size:9px;letter-spacing:1.5px}.watermark-circle{width:76px;height:76px}.watermark-logo{width:66px;height:66px}}
</style>
